<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sonnet Bot 表情实验室 · 试玩</title>
<style>html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#0d0b14}
.bar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:12px;padding:9px 16px;background:linear-gradient(135deg,#fa7e1e,#d62976 50%,#962fbf);color:#fff;box-shadow:0 2px 14px rgba(0,0,0,.4)}
.bar b{font-size:16px;white-space:nowrap;text-shadow:0 1px 4px rgba(0,0,0,.3)}
.bar .tip{flex:1;font-size:13px;font-weight:600;opacity:.96;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tip em{font-style:normal;background:rgba(255,255,255,.25);padding:2px 8px;border-radius:6px;margin:0 4px}
.bar a{color:#fff;background:rgba(255,255,255,.92);color:#d62976;text-decoration:none;padding:8px 16px;border-radius:99px;font-size:13px;font-weight:800;white-space:nowrap;transition:.18s;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.bar a:hover{background:#fff;transform:translateY(-1px) scale(1.03)}
iframe{position:fixed;top:48px;left:0;width:100%;height:calc(100% - 48px);border:0;background:#fff}
.badge{display:inline-block;width:8px;height:8px;border-radius:50%;background:#7CFC00;margin-right:7px;box-shadow:0 0 8px #7CFC00;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.4}}</style></head>
<body><div class="bar"><b>🐾 Sonnet Bot</b><span class="tip"><span class="badge"></span>自动巡演中 · 39 种表情轮播 · <em>滑动</em>控制视线 · <em>单击</em>有惊喜 · <em>右键</em>更多</span><a href="https://github.com/sukikeeling/moodie-pet/releases" target="_blank" rel="noopener">⬇ 下载桌宠</a></div>
<iframe id="lab" src="moodle-lab.html" title="Sonnet Bot 表情实验室"></iframe>
<script>
function onLab(){
  try{
    var f=document.getElementById('lab'); var d=f.contentWindow.document;
    // 默认开启自动巡演（不用访客按按钮）
    var auto=d.querySelector('#auto');
    if(auto && auto.getAttribute('aria-pressed')!=='true') auto.click();
    // 把提示词写明显些
    var st=d.createElement('style');
    st.textContent='.hint{font-size:15px!important;font-weight:800!important;color:#d62976!important;background:rgba(255,255,255,.9)!important;padding:7px 18px!important;border-radius:99px!important;left:50%!important;transform:translateX(-50%)!important;width:auto!important;box-shadow:0 4px 16px rgba(70,30,110,.25)!important} .stack-tip{font-size:13px!important;font-weight:800!important;color:#4a3a5e!important;background:rgba(255,255,255,.92)!important;padding:6px 14px!important;border-radius:99px!important;box-shadow:0 3px 12px rgba(70,30,110,.2)!important} .header h1{font-size:22px!important} .header p{color:rgba(255,255,255,.95)!important}';
    d.head.appendChild(st);
    var h=d.querySelector('#hint'); if(h) h.textContent='自动巡演中 · 滑动小脸控制视线 · 单击有惊喜';
    var sp=d.querySelector('.stack-tip'); if(sp) sp.textContent='👆 单击展开 · 双击切换 · 拖动翻卡';
    // 改名 Sonnet Bot
    var h1=d.querySelector('.header h1'); if(h1) h1.textContent='Sonnet Bot 表情实验室';
    var hp=d.querySelector('.header p'); if(hp) hp.textContent='SONNET BOT · FACE LAB';
    d.title='Sonnet Bot 表情实验室';
  }catch(e){console.warn('lab inject:',e)}
}
document.getElementById('lab').addEventListener('load',onLab);
</script></body></html>
