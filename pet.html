<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Sonnet Bot</title>
<style>
  :root {
    --bot-color: #ff5d9e;
    --eye-color: #fffdf7;   /* 眼睛底色（Grok 主题为纯白） */
    --demo-bg: #ffffff;     /* 浏览器演示模式背景 */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: transparent;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  body { display: grid; place-items: center; cursor: grab; }
  body.dragging { cursor: grabbing; }
  /* 浏览器（非 Electron）打开时：纯白演示背景，方便直接预览 */
  body.web-demo { background: var(--demo-bg); }
  body.web-demo .bot { filter: drop-shadow(0 20px 24px rgba(0,0,0,.22)); }

  .stage {
    perspective: 900px;
    position: relative;
    width: 230px; height: 230px;
    display: grid; place-items: center;
    transform-origin: 50% 100%;
    transition: transform .35s cubic-bezier(.34,1.45,.56,1);
    --inv: 1;
  }
  .bot3d { transform-style: preserve-3d; will-change: transform; }
  .bot {
    width: 230px; height: 230px; overflow: visible;
    filter: drop-shadow(0 16px 14px rgba(0,0,0,.42));
    will-change: transform; display: block;
  }
  .body { fill: var(--bot-color); transition: fill .5s ease; }
  .eye { fill: var(--eye-color); transition: fill .5s ease; }
  .orbit { fill: none; stroke: #e36f3d; stroke-width: 1; stroke-dasharray: 5 6; opacity: 0; }
  .viewer.guides .orbit { opacity: .55; }

  /* mood speech tag（随宠物缩放反向缩放，保持可读） */
  .mood-tag {
    position: absolute; bottom: 100%; left: 50%; margin-bottom: 4px;
    transform: translate(-50%, 0) scale(calc(.6 * var(--inv)));
    transform-origin: 50% 100%;
    background: #fff; color: #4a3a5e;
    padding: 6px 15px; border-radius: 99px;
    font-size: 13px; font-weight: 700; white-space: nowrap;
    box-shadow: 0 6px 18px rgba(70,30,110,.28);
    opacity: 0; pointer-events: none; max-width: 240px;
    transition: opacity .35s ease, transform .45s cubic-bezier(.34,1.6,.56,1);
  }
  .mood-tag.show { opacity: 1; transform: translate(-50%, 0) scale(calc(1 * var(--inv))); }
  .mood-tag::after {
    content: ""; position: absolute; bottom: -5px; left: 50%;
    transform: translateX(-50%) scale(var(--inv));
    border: 6px solid transparent; border-top-color: #fff;
  }
  /* Grok 主题：弹出词黑底白字极简风 */
  body.grok-theme .mood-tag { background: #0d0d0f; color: #fff; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
  body.grok-theme .mood-tag::after { border-top-color: #0d0d0f; }

  /* 尺寸控制（悬停显示，反向缩放保持可点） */
  .size-ctrl {
    position: absolute; top: 4px; right: 4px;
    display: flex; gap: 5px;
    transform: scale(var(--inv)); transform-origin: 100% 0;
    opacity: 0; pointer-events: none; transition: opacity .25s ease;
  }
  .stage:hover .size-ctrl { opacity: 1; pointer-events: auto; }
  .size-ctrl button {
    width: 26px; height: 26px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.75);
    background: rgba(255,255,255,.93); color: #4a3a5e;
    font-size: 16px; font-weight: 700; line-height: 1;
    box-shadow: 0 3px 10px rgba(70,30,110,.25); cursor: pointer;
    display: grid; place-items: center;
  }
  .size-ctrl button:hover { background: #fff; }
  .size-ctrl button:active { transform: scale(.92); }

  /* ===== body parts / accessories (ported) ===== */
  .body-part, .accessory { display: none; }
  .body-part { fill: none; stroke: var(--bot-color); stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; }
  .body-part circle, .body-part ellipse { fill: var(--bot-color); stroke: none; }
  .body-part.enabled, .accessory.enabled, .quick-wave #part-hands { display: block; }
  .back-accessory { fill: #7657d8; opacity: .88; }
  .front-accessory { stroke: #171813; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
  .front-accessory circle { fill: rgba(255,255,255,.12); }
  #accessory-straw-hat { fill: #e9bd57; stroke: #b57b24; stroke-width: 3; }
  #accessory-straw-hat .hat-band { fill: #d94b5d; stroke: none; }
  #accessory-glasses { fill: none; }
  #accessory-bowtie { fill: #ff2d8b; stroke: none; }

  /* ===== state actions ===== */
  .bot.act-bounce { animation: bounce .85s ease; }
  .bot.act-tilt { animation: tilt .8s ease; }
  .bot.act-scan #eyes { animation: scan .8s ease; }
  .bot.act-turn { animation: turn .9s ease; }
  .bot.act-pulse { animation: pulse .9s ease; }
  .bot.act-glitch { animation: glitch .55s steps(2); }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 40%{transform:translateY(-34px) scale(.96,1.04)} 65%{transform:translateY(4px) scale(1.05,.94)} }
  @keyframes tilt { 35%{transform:rotate(-19deg) translate(-8px,5px)} 70%{transform:rotate(8deg)} }
  @keyframes scan { 0%,100%{transform:translate(0)} 30%{transform:translate(-24px,2px)} 70%{transform:translate(24px,-2px)} }
  @keyframes turn { 0%,100%{transform:rotateY(0)} 48%{transform:rotateY(180deg) scale(.82)} }
  @keyframes pulse { 0%,100%{transform:scale(1)} 35%{transform:scale(1.08,.92)} 65%{transform:scale(.94,1.08)} }
  @keyframes glitch { 0%,100%{transform:translate(0)} 25%{transform:translate(-9px,3px);filter:drop-shadow(8px 0 #e36f3d)} 50%{transform:translate(10px,-3px);filter:drop-shadow(-8px 0 #79e2d0)} 75%{transform:translate(-4px,1px)} }

  /* ===== quick jelly actions ===== */
  .bot.quick-bounce { animation: quick-bounce .75s cubic-bezier(.3,.8,.4,1); }
  .bot.quick-shake { animation: quick-shake .65s ease; }
  .bot.quick-peek { animation: quick-peek .9s ease; }
  .bot.quick-pinch { animation: quick-pinch 1.12s cubic-bezier(.34,1.45,.56,1); }
  .bot.quick-pinch #eyes { transform-box: fill-box; transform-origin: center; animation: pinch-eyes 1.12s cubic-bezier(.34,1.45,.56,1); }
  .bot.quick-squish { animation: quick-squish .8s ease; }
  .bot.quick-wave #hand-right { transform-box: fill-box; transform-origin: 0 0; animation: quick-wave .6s ease 2; }
  @keyframes quick-bounce { 0%,100%{transform:translateY(0) scale(1)} 38%{transform:translateY(-48px) scale(.95,1.05)} 60%{transform:translateY(3px) scale(1.08,.9)} }
  @keyframes quick-shake { 0%,100%{transform:rotate(0)} 20%{transform:rotate(-13deg)} 40%{transform:rotate(13deg)} 60%{transform:rotate(-10deg)} 80%{transform:rotate(8deg)} }
  @keyframes quick-peek { 0%,100%{transform:translateX(0) rotate(0)} 35%{transform:translateX(-78px) rotate(-16deg)} 70%{transform:translateX(62px) rotate(12deg)} }
  @keyframes quick-pinch { 0%,100%{transform:scale(1)} 24%{transform:scale(.62,1.14)} 44%{transform:scale(1.13,.89)} 61%{transform:scale(.91,1.08)} 76%{transform:scale(1.05,.96)} 89%{transform:scale(.98,1.02)} }
  @keyframes pinch-eyes { 0%,100%{transform:scaleX(1)} 24%{transform:scaleX(.56)} 44%{transform:scaleX(1.16)} 61%{transform:scaleX(.9)} }
  @keyframes quick-squish { 0%,100%{transform:scale(1)} 30%{transform:scale(1.15,.72) translateY(20px)} 60%{transform:scale(.86,1.18) translateY(-14px)} }
  @keyframes quick-wave { 0%,100%{transform:rotate(0)} 50%{transform:rotate(-70deg)} }
  .bot.quick-celebrate { animation: quick-celebrate 1s ease; }
  @keyframes quick-celebrate { 0%,100%{transform:translateY(0) scale(1,1)} 30%{transform:translateY(-26px) scale(.94,1.08)} 55%{transform:translateY(2px) scale(1.06,.92)} 80%{transform:translateY(-12px) scale(.97,1.04)} }

  /* ===== 状态特效层（轨道激光 / 雷达波纹 / 加载弧 / 警报脉冲 / 扫描光束 + 粒子） ===== */
  #fx { position:absolute; inset:0; display:grid; place-items:center; pointer-events:none; overflow:visible; z-index:0; }
  .bot3d { position:relative; z-index:2; }
  #fx > span, #fx::before, #fx::after { position:absolute; left:50%; top:50%; }
  #fx::before, #fx::after { content:""; }

  /* 轨道：三色霓虹轨道环（多色细线旋转，不同转速/方向） */
  #fx.fx-orbit .ring { position:absolute; left:50%; top:50%; border-radius:50%; border:2px solid transparent; pointer-events:none; }
  #fx.fx-orbit .ring.r1 { width:226px; height:92px; margin:-46px 0 0 -113px;
    border-top-color:#79e2d0; border-right-color:#e36f3d;
    box-shadow:0 0 12px #79e2d0, 0 0 22px rgba(121,226,208,.45); animation:fx-spin 3.2s linear infinite; }
  #fx.fx-orbit .ring.r2 { width:196px; height:196px; margin:-98px 0 0 -98px;
    border-top-color:#ff5d9e; border-left-color:#8656f6; border-bottom-color:#ffd84d;
    box-shadow:0 0 16px #ff5d9e, 0 0 28px rgba(255,93,158,.4); animation:fx-spin 5.4s linear infinite reverse; }
  #fx.fx-orbit .ring.r3 { width:248px; height:104px; margin:-52px 0 0 -124px;
    border-top-color:#08c77a; border-bottom-color:#2f86ed; opacity:.75;
    box-shadow:0 0 14px rgba(8,199,122,.5); animation:fx-spin 4.2s linear infinite; }

  /* 雷达：外传波纹（涟漪向外扩散并淡出） */
  #fx.fx-radar::before, #fx.fx-radar::after { width:90px; height:90px; margin:-45px 0 0 -45px; border-radius:50%;
    border:2px solid #08b9a9; box-shadow:0 0 10px rgba(8,185,169,.6); opacity:0; animation:fx-ripple 2.4s ease-out infinite; }
  #fx.fx-radar::after { border-color:#08c77a; box-shadow:0 0 10px rgba(8,199,122,.6); animation-delay:.8s; }
  #fx.fx-radar > .ripple { width:90px; height:90px; margin:-45px 0 0 -45px; border-radius:50%; border:2px solid #2f86ed;
    box-shadow:0 0 10px rgba(47,134,237,.5); opacity:0; animation:fx-ripple 2.4s ease-out infinite 1.6s; }
  @keyframes fx-ripple { 0%{transform:scale(.35);opacity:.95} 70%{opacity:.35} 100%{transform:scale(3.4);opacity:0} }

  /* 加载：旋转霓虹弧 */
  #fx.fx-loading::before { width:156px; height:156px; margin:-78px 0 0 -78px; border-radius:50%;
    border:4px solid rgba(255,93,158,.16); border-top-color:#ff5d9e; box-shadow:0 0 18px rgba(255,93,158,.45); animation:fx-spin 1.1s linear infinite; }

  /* 警报：红色脉冲环 */
  #fx.fx-alert::before { width:188px; height:188px; margin:-94px 0 0 -94px; border-radius:50%;
    border:3px solid #ff3347; box-shadow:0 0 26px #ff3347, inset 0 0 16px rgba(255,51,71,.3); animation:fx-pulse 1s ease-in-out infinite; }
  @keyframes fx-pulse { 0%,100%{transform:scale(.92);opacity:.55} 50%{transform:scale(1.08);opacity:1} }

  /* 扫描：横扫光束 */
  #fx.fx-scan { overflow:hidden; }
  #fx.fx-scan::before { width:14px; height:170px; margin-top:-85px; margin-left:-7px;
    background:linear-gradient(to bottom, transparent, #79e2d0 50%, transparent); filter:blur(2px);
    box-shadow:0 0 18px #79e2d0; animation:fx-sweep 1.6s ease-in-out infinite; border-radius:50%; }
  @keyframes fx-sweep { 0%{transform:translateX(-72px)} 50%{transform:translateX(72px)} 100%{transform:translateX(-72px)} }
  @keyframes fx-spin { to { transform:rotate(360deg); } }

  /* 加载三圆点（loading 类状态，身体下方跳动） */
  #fx .fx-dots { position:absolute; left:50%; top:63%; display:flex; gap:9px;
    transform:translate(-50%,-50%); pointer-events:none; }
  #fx .fx-dots i { width:11px; height:11px; border-radius:50%; background:var(--bot-color);
    opacity:.5; animation:fx-dot-bounce 1.15s ease-in-out infinite; }
  #fx .fx-dots i:nth-child(2) { animation-delay:.16s; }
  #fx .fx-dots i:nth-child(3) { animation-delay:.32s; }
  @keyframes fx-dot-bounce { 0%,100%{transform:translateY(0);opacity:.35} 40%{transform:translateY(-13px);opacity:1} }

  /* 数学曲线粒子尾迹（math-curve-loaders 灵感）：彩色粒子沿参数曲线游走 + 渐隐尾迹 + 呼吸 + 缓旋 */
  #fx.fx-curve { z-index: 3; }   /* 曲线层放身体前面（粒子轨迹清晰可见） */
  #fx.fx-curve .curve-wrap { position:absolute; left:0; top:0; width:228px; height:228px; pointer-events:none; }
  #fx.fx-curve .curve-wrap circle { will-change: cx,cy,r; }

  /* Grok 主题黑球光泽高光（body 上叠加渐变，theme=grok 时显示） */
  #body-shine { opacity: 0; pointer-events: none; fill: url(#grok-shine); transition: opacity .5s ease; }
  body.grok-theme #body-shine { opacity: 1; }

  /* Grok 彩虹拖尾：从身体边缘甩出彩虹渐变弧线（红→橙→黄→绿→青→蓝→紫） */
  .fx-trail { position:absolute; width:104px; height:4px; border-radius:3px;
    background: linear-gradient(90deg, #ff3347, #ff9800, #ffd84d, #08c77a, #2f86ed, #8656f6);
    filter: blur(.4px); opacity:0; pointer-events:none; animation: fx-trail .85s ease-out forwards; }
  @keyframes fx-trail { 0%{ transform: rotate(var(--rot)) translateX(30px) scaleX(.25); opacity:0 }
    22%{ opacity:.95 } 100%{ transform: rotate(var(--rot)) translateX(var(--dist,130px)) scaleX(1.15); opacity:0 } }

  /* Grok 附加元素：感叹号底部圆点 / 右上角蓝点 / loading 三圆点两侧小黑点 */
  #exclaim-dot { fill: var(--bot-color); opacity:0; pointer-events:none; transition: opacity .25s ease; }
  #grok-blue-dot { fill: #2f86ed; opacity:0; pointer-events:none; transition: opacity .25s ease; }
  #grok-dot-l, #grok-dot-r { fill: var(--bot-color); opacity:0; pointer-events:none; transition: opacity .25s ease; }

  /* 粒子（JS 生成 span） */
  .fx-heart, .fx-z, .fx-spark, .fx-note, .fx-dot, .fx-confetti { position:absolute; }
  .fx-heart { color:#ff2d8b; font-size:18px; text-shadow:0 0 6px rgba(255,45,139,.6); animation:fx-float 1.6s ease-out forwards; }
  .fx-z { color:#6b5d7e; font-size:20px; font-weight:700; animation:fx-float 1.9s ease-out forwards; }
  .fx-note { color:#8656f6; font-size:16px; text-shadow:0 0 6px rgba(134,86,246,.6); animation:fx-float 1.6s ease-out forwards; }
  /* 视频同款音符：头顶生成，粉/黄上浮 + 左右摇摆（1.7s 节奏循环） */
  .fx-note-swing { position:absolute; font-size:22px; line-height:1; animation:fx-note-swing 1.7s ease-out forwards; }
  .fx-note-swing.c-pink { color:#ff69b4; text-shadow:0 0 10px rgba(255,105,180,.85), 0 0 20px rgba(255,105,180,.35); }
  .fx-note-swing.c-yellow { color:#ffd84d; text-shadow:0 0 10px rgba(255,216,77,.85), 0 0 20px rgba(255,216,77,.35); }
  @keyframes fx-note-swing {
    0%   { transform:translate(0,0) rotate(-8deg) scale(.4); opacity:0; }
    12%  { transform:translate(-6px,-12px) rotate(-6deg) scale(.75); opacity:1; }
    38%  { transform:translate(9px,-34px) rotate(7deg) scale(1); }
    62%  { transform:translate(-8px,-58px) rotate(-9deg) scale(1.04); }
    85%  { transform:translate(6px,-82px) rotate(6deg) scale(1.08); opacity:.85; }
    100% { transform:translate(-4px,-108px) rotate(-4deg) scale(1.12); opacity:0; }
  }
  .fx-spark { color:#ffd84d; font-size:14px; text-shadow:0 0 8px rgba(255,216,77,.8); animation:fx-twinkle 1.2s ease-out forwards; }
  /* 视频同款星星：四周放射状扩散 + 放大 + 淡出（金/白，中间点 JS 预计算 --dx1/--dx2） */
  .fx-star-burst { position:absolute; font-size:20px; line-height:1; animation:fx-star-burst 1.15s ease-out forwards; }
  .fx-star-burst.c-gold { color:#ffd84d; text-shadow:0 0 10px rgba(255,216,77,.9), 0 0 22px rgba(255,216,77,.4); }
  .fx-star-burst.c-white { color:#ffffff; text-shadow:0 0 10px rgba(255,255,255,.9), 0 0 22px rgba(255,255,255,.4); }
  @keyframes fx-star-burst {
    0%   { transform:translate(0,0) scale(.25) rotate(0deg); opacity:0; }
    18%  { transform:translate(var(--dx1), var(--dy1)) scale(.6) rotate(28deg); opacity:1; }
    55%  { transform:translate(var(--dx2), var(--dy2)) scale(1.05) rotate(58deg); opacity:.95; }
    100% { transform:translate(var(--dx), var(--dy)) scale(1.4) rotate(92deg); opacity:0; }
  }
  .fx-dot { width:9px; height:9px; border-radius:50%; background:#4a3a5e; animation:fx-bob 1.2s ease-in-out forwards; }
  .fx-confetti { width:8px; height:12px; border-radius:2px; animation:fx-burst 1.5s ease-out forwards; }
  .fx-fw { position:absolute; width:5px; height:5px; border-radius:50%; animation:fw-burst .95s ease-out forwards; }
  @keyframes fw-burst { 0%{transform:translate(0,0) scale(1.3);opacity:1} 60%{opacity:1} 100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0} }
  .fx-rocket { position:absolute; width:4px; height:4px; border-radius:50%; animation:fw-rise .55s ease-out forwards; }
  @keyframes fw-rise { 0%{transform:translateY(0);opacity:1} 75%{opacity:1} 100%{transform:translateY(var(--rise,-160px));opacity:0} }
  .fx-tear { position:absolute; color:#5ec5ff; font-size:14px; text-shadow:0 0 5px rgba(94,197,255,.6); animation:fx-fall 1.6s ease-in forwards; }
  @keyframes fx-fall { 0%{transform:translateY(-10px);opacity:0} 15%{opacity:1} 100%{transform:translateY(60px);opacity:0} }
  .fx-exclaim { position:absolute; color:#ff5d9e; font-size:22px; font-weight:900; text-shadow:0 0 8px rgba(255,93,158,.8); animation:fx-pop .8s ease-out forwards; }
  @keyframes fx-pop { 0%{transform:scale(0) translateY(8px);opacity:0} 40%{transform:scale(1.3) translateY(-4px);opacity:1} 100%{transform:scale(.8) translateY(-20px);opacity:0} }
  .fx-steam { position:absolute; width:12px; height:12px; border-radius:50%; background:rgba(180,180,190,.5); animation:fx-steam 1.4s ease-out forwards; }
  @keyframes fx-steam { 0%{transform:translateY(0) scale(.4);opacity:0} 25%{opacity:.8} 100%{transform:translateY(-50px) scale(1.4);opacity:0} }
  .fx-haha { position:absolute; color:#ff9800; font-size:16px; font-weight:900; text-shadow:0 0 6px rgba(255,152,0,.7); animation:fx-haha 1.2s ease-out forwards; }
  @keyframes fx-haha { 0%{transform:scale(.4) translateY(0);opacity:0} 30%{opacity:1} 100%{transform:scale(1.1) translateY(-40px) rotate(8deg);opacity:0} }
  @keyframes fx-float { 0%{transform:translate(0,0) scale(.5);opacity:0} 15%{opacity:1} 100%{transform:translate(var(--dx,0),-130px) scale(1.15);opacity:0} }
  @keyframes fx-bob { 0%{transform:translateY(0);opacity:0} 30%{opacity:1} 100%{transform:translateY(-34px);opacity:0} }
  @keyframes fx-burst { 0%{transform:translate(0,0) rotate(0);opacity:1} 100%{transform:translate(var(--dx,0),var(--dy,80px)) rotate(var(--rot,360deg));opacity:0} }
  @keyframes fx-twinkle { 0%{transform:scale(0) rotate(0);opacity:0} 40%{transform:scale(1.4) rotate(40deg);opacity:1} 100%{transform:scale(.2) rotate(120deg);opacity:0} }
</style>
</head>
<body>
  <div class="stage" id="viewer">
    <div class="mood-tag" id="mood-tag">待机</div>
    <div id="fx"><span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span></div>
    <div class="bot3d" id="bot3d">
      <svg class="bot" id="bot" viewBox="-28 -28 285 285" role="img" aria-label="Sonnet Bot">
        <defs>
          <clipPath id="head-clip"><path id="shape-clip-path" d="M228.541 114.228C228.541 130.133 225.184 145.994 218.738 160.534C212.674 174.217 203.904 186.669 193.065 196.988C155.933 232.34 99.497 238.596 55.5255 212.24C45.097 205.99 35.6851 198.072 27.7451 188.866C19.1926 178.953 12.3686 167.569 7.65781 155.351C2.60712 142.264 0 128.257 0 114.228C0 98.3219 3.35751 82.4611 9.80315 67.9215C15.8672 54.2382 24.6377 41.7862 35.4767 31.4668C72.6081 -3.88483 129.044 -10.1413 173.016 16.2153C183.444 22.4653 192.856 30.3829 200.796 39.5896C209.349 49.5018 216.173 60.8859 220.883 73.1037C225.934 86.1906 228.541 100.198 228.541 114.228Z"/></clipPath>
          <!-- Grok 主题黑球光泽：左上高光 + 底部反光 -->
          <radialGradient id="grok-shine" cx="34%" cy="28%" r="78%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity=".22"/>
            <stop offset="38%" stop-color="#ffffff" stop-opacity=".05"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="grok-rim" x1="0" y1="0" x2="0" y2="1">
            <stop offset="72%" stop-color="#ffffff" stop-opacity="0"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity=".16"/>
          </linearGradient>
        </defs>
        <ellipse class="orbit" cx="114" cy="115" rx="107" ry="38"/>

    tilt = ['listening','thinking','curious','confused','shy','dragging'],
    scan = ['searching','working','radar','dictating','writing','uploading'],
    turning = ['orbit','spawning','sending','receiving'],
    pulse = ['sleeping','drowsy','bored','humming','loading','progress','powering-down'];
  let cls = 'glitch';
  if (bounce.includes(name)) cls = 'bounce';
  else if (tilt.includes(name)) cls = 'tilt';
  else if (scan.includes(name)) cls = 'scan';
  else if (turning.includes(name)) { cls = 'turn'; viewer.classList.add('guides'); }
  else if (pulse.includes(name)) cls = 'pulse';
  bot.classList.remove('act-bounce','act-tilt','act-scan','act-turn','act-pulse','act-glitch');
  void bot.offsetWidth;
  bot.classList.add(`act-${cls}`);
  setTimeout(() => { bot.classList.remove(`act-${cls}`); viewer.classList.remove('guides'); }, 1100);
}

/* ===== 快捷果冻动作 ===== */
const quickClasses = ['quick-bounce','quick-shake','quick-peek','quick-pinch','quick-squish','quick-wave','quick-celebrate'];
function playQuickAction(name) {
  [...quickClasses, 'act-bounce','act-tilt','act-scan','act-turn','act-pulse','act-glitch'].forEach(cls => bot.classList.remove(cls));
  viewer.classList.remove('guides');
  void bot.offsetWidth;
  bot.classList.add(`quick-${name}`);
  const dur = name === 'wave' ? 1350 : name === 'pinch' ? 1200 : name === 'celebrate' ? 1000 : 950;
  setTimeout(() => bot.classList.remove(`quick-${name}`), dur);
}

/* ===== 数学曲线粒子尾迹（math-curve-loaders 灵感，彩色模式） =====
   thinking→圆形双线汇聚 / loading→玫瑰曲线 / working→利萨如曲线
   粒子沿参数曲线游走，拖彩虹渐隐尾迹，曲线随 detailScale 呼吸胀缩 + 可选缓旋转 */
const CURVE_COLORS = ['#ff5d9e', '#ff9800', '#ffd84d', '#08c77a', '#79e2d0', '#2f86ed', '#8656f6'];
const MATH_CURVES = {
  circle: { // 圆形双线汇聚：两条彩虹粒子链反向绕圆，相隔 180° 双向汇聚
    strokeWidth: 2.2, rotate: false, particleCount: 48, trailSpan: 0.42, dual: true,
    durationMs: 5200, rotationDurationMs: 28000, pulseDurationMs: 4600,
    point(progress, detailScale, c) {
      const t = progress * Math.PI * 2;
      const r = c.r * detailScale;
      return { x: 114 + r * Math.cos(t), y: 114 + r * Math.sin(t) };
    }, r: 112,   // 圆环半径 112 > 球半径 105，环绕小球边界外侧（×0.98 呼吸后仍 ≥109）
  },
  rose: { // 玫瑰光环：r = Rbase + a·cos(kθ)（k=7 七瓣），环带在球边界外侧
    strokeWidth: 2.0, rotate: true, particleCount: 64, trailSpan: 0.36,
    durationMs: 5400, rotationDurationMs: 30000, pulseDurationMs: 4600,
    point(progress, detailScale, c) {
      const t = progress * Math.PI * 2;
      const r = (c.rbase + c.a * Math.cos(c.k * t)) * detailScale;
      return { x: 114 + r * Math.cos(t), y: 114 + r * Math.sin(t) };
    }, rbase: 96, a: 16, k: 7,   // r ∈ [80, 112]：环带围绕小球边界
  },
  lissajous: { // 利萨如光环：x=a·sin(3t)  y=b·sin(2t)（工作波形），波形环在球外
    strokeWidth: 2.0, rotate: false, particleCount: 72, trailSpan: 0.32,
    durationMs: 8400, rotationDurationMs: 44000, pulseDurationMs: 6800,
    point(progress, detailScale, c) {
      const t = progress * Math.PI * 2;
      const x = c.a * Math.sin(3 * t + 0.3) * (0.9 + 0.1 * detailScale);
      const y = c.b * Math.sin(2 * t) * (0.9 + 0.1 * detailScale);
      return { x: 114 + x, y: 114 + y };
    }, a: 106, b: 102,   // 上下/左右振幅 > 球半径，波形环绕球外侧
  },
};
const FX_CURVE = { thinking: 'circle', loading: 'rose', working: 'lissajous' };
let curveFx = null; // { kind, wrap, path, pts[], start, raf, cfg }
function normalizeProgress(p) { return ((p % 1) + 1) % 1; }
function curveDetailScale(time, cfg, phase) {
  const pp = ((time + phase * cfg.pulseDurationMs) % cfg.pulseDurationMs) / cfg.pulseDurationMs;
  return 0.98 + ((Math.sin(pp * Math.PI * 2 + 0.55) + 1) / 2) * 0.02;   // 0.98~1.0 微呼吸：粒子始终在球边界外侧
}
function curveParticle(cfg, idx, progress, detailScale, count) {
  const n = count || cfg.particleCount;
  const tailOffset = idx / (n - 1);
  const pt = cfg.point(normalizeProgress(progress - tailOffset * cfg.trailSpan), detailScale, cfg);
  const fade = Math.pow(1 - tailOffset, 0.56);
  return { x: pt.x, y: pt.y, r: 1.2 + fade * 3.2, o: 0.05 + fade * 0.95 };
}
function startCurveFx(kind) {
  stopCurveFx();
  const cfg = MATH_CURVES[kind];
  if (!cfg) return;
  fxLayer.classList.add('fx-curve');
  const wrap = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  wrap.setAttribute('class', 'curve-wrap');
  wrap.setAttribute('viewBox', '0 0 228 228');
  const pts = [];
  for (let i = 0; i < (cfg.dual ? cfg.particleCount * 2 : cfg.particleCount); i++) {
    const ci = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    const col = CURVE_COLORS[i % CURVE_COLORS.length];
    ci.setAttribute('fill', col);
    pts.push(ci);
    wrap.appendChild(ci);
  }
  fxLayer.appendChild(wrap);
  curveFx = { kind, cfg, wrap, path: null, pts, start: performance.now(), phase: Math.random(), raf: null };
  const tick = (now) => {
    if (!curveFx) return;
    const t = now - curveFx.start;
    const progress = (t % cfg.durationMs) / cfg.durationMs;
    const ds = curveDetailScale(t, cfg, curveFx.phase);
    const rot = cfg.rotate ? -((t % cfg.rotationDurationMs) / cfg.rotationDurationMs) * 360 : 0;
    wrap.setAttribute('transform', rot ? `rotate(${rot.toFixed(2)} 114 114)` : '');
    if (cfg.dual) {
      // 双线汇聚：链 A 正向走，链 B 相位 +0.5（相隔180°）反向汇聚
      const half = Math.ceil(pts.length / 2);
      for (let i = 0; i < pts.length; i++) {
        const chain = i < half ? 0 : 1;
        const j = chain === 0 ? i : i - half;
        const prog = chain === 0 ? progress : normalizeProgress(progress + 0.5);
        const p = curveParticle(cfg, j, prog, ds, half);
        pts[i].setAttribute('cx', p.x.toFixed(2));
        pts[i].setAttribute('cy', p.y.toFixed(2));
        pts[i].setAttribute('r', p.r.toFixed(2));
        pts[i].setAttribute('opacity', p.o.toFixed(3));
      }
    } else {
      for (let i = 0; i < pts.length; i++) {
        const p = curveParticle(cfg, i, progress, ds);
        pts[i].setAttribute('cx', p.x.toFixed(2));
        pts[i].setAttribute('cy', p.y.toFixed(2));
        pts[i].setAttribute('r', p.r.toFixed(2));
        pts[i].setAttribute('opacity', p.o.toFixed(3));
      }
    }
    curveFx.raf = requestAnimationFrame(tick);
  };
  curveFx.raf = requestAnimationFrame(tick);
}
function stopCurveFx() {
  if (!curveFx) return;
  cancelAnimationFrame(curveFx.raf);
  curveFx.wrap.remove();
  fxLayer.classList.remove('fx-curve');
  curveFx = null;
}

function setEffect(state) {
  fxLayer.className = '';
  stopCurveFx();
  clearInterval(fxSpawnTimer); clearInterval(fxFwTimer); clearInterval(fxBurstTimer);
  clearInterval(fxNoteTimer); clearInterval(fxStarTimer);
  fxSpawnTimer = null; fxFwTimer = null; fxBurstTimer = null;
  fxNoteTimer = null; fxStarTimer = null;
  const dots = fxLayer.querySelector('.fx-dots');
  if (dots) dots.remove();
  const ring = FX_RING[state];
  if (ring) fxLayer.classList.add(ring);
  if (FX_CURVE[state]) startCurveFx(FX_CURVE[state]);
  if (FX_DOTS.has(state)) {
    const d = document.createElement('div');
    d.className = 'fx-dots';
    d.innerHTML = '<i></i><i></i><i></i>';
    fxLayer.appendChild(d);
  }
  if (state === 'humming') {            // 视频同款音符：头顶上浮摇摆，1.7s 节奏循环
    spawnNoteSwing(2);
    fxNoteTimer = setInterval(() => { if (!autoPaused) spawnNoteSwing(2); }, 1700);
  }
  if (state === 'excited') {            // 视频同款星星：四周放射扩散放大淡出，金/白
    spawnStarBurst(10);
    fxStarTimer = setInterval(() => { if (!autoPaused) spawnStarBurst(10); }, 1500);
  }
  if (FX_PARTICLE[state]) {
    const rate = FX_PARTICLE[state];
    for (let i = 0; i < (state === 'celebrate' ? 10 : 2); i++) spawnFxParticle(state);
    fxSpawnTimer = setInterval(() => { if (!autoPaused) spawnFxParticle(state); }, rate);
  }
  if (FX_BURST[state]) {
    spawnBurst();
    fxBurstTimer = setInterval(() => { if (!autoPaused) spawnBurst(); }, FX_BURST[state]);
  }
  if (FX_FIREWORK[state]) {
    spawnFirework();
    fxFwTimer = setInterval(() => { if (!autoPaused) spawnFirework(); }, FX_FIREWORK[state]);
  }
}

/* ===== 自动轮询：状态切换 + 表情循环 + 眨眼 + 偶发小动作 ===== */
const ALL_STATES = Object.values(DATA.GROUPS).flat();
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
let autoPaused = false;
let stateTimer = null, exprTimer = null, blinkTimer = null, tagTimer = null, chatterTimer = null;

function showMood(text) {
  moodTag.textContent = text;
  moodTag.classList.add('show');
  clearTimeout(tagTimer);
  tagTimer = setTimeout(() => moodTag.classList.remove('show'), 3800);
}
const showLine = state => showMood(randLine(state));

// 偏向特效状态 + 工作流：让烟花/雷达/轨道/爱心等特效常出现，又不全是普通表情
const EFFECT_STATES = ['orbit','radar','loading','alerting','searching','celebrate','happy','excited','sleeping','humming','thinking','sad','surprised','scared','angry','laughing'];
function pickState() {
  const r = Math.random();
  if (r < 0.30) return pick(EFFECT_STATES);                  // 特效状态常出现（30%）
  if (r < 0.70) return pick(DATA.GROUPS['Cycle produit']);     // 工作流
  return pick(ALL_STATES);
}
function petSetState(name) {
  activeState = name;
  const pool = DATA.POOLS[name];
  if (pool && pool.length) chooseExpression(pool[Math.floor(Math.random() * pool.length)]);
  else chooseExpression(Math.floor(Math.random() * DATA.EXPRESSIONS.length)); // 容错：未知状态给随机表情
  stateMotion(name);
  setEffect(name);
  if (!autoPaused && Math.random() < 0.12 && SKETCHES.length) showSketch(pick(SKETCHES));
  else showLine(name);
  // 庆祝：双脚连跳（烟花特效由 setEffect 负责）
  if (name === 'celebrate') playQuickAction('celebrate');
}
function cycleExpr() {
  clearTimeout(exprTimer);
  if (theme === 'grok') return;                     // Grok 主题下表情由 Grok 状态机接管
  if (autoPaused) { exprTimer = setTimeout(cycleExpr, 2000); return; }
  const pool = DATA.POOLS[activeState] || [];
  if (!pool.length) { exprTimer = setTimeout(cycleExpr, 3000); return; } // 容错
  let idx = pick(pool);
  if (idx === expression && pool.length > 1) idx = pick(pool);
  chooseExpression(idx);
  const cad = DATA.EXPR_CADENCE[activeState] || [3000, 5000];
  exprTimer = setTimeout(cycleExpr, rand(cad[0], cad[1]));
}
function changeState() {
  clearTimeout(stateTimer);
  if (theme === 'grok') return;                     // Grok 主题下状态由 Grok 状态机接管
  if (autoPaused) { stateTimer = setTimeout(changeState, 3000); return; }
  try {
    let s; do { s = pickState(); } while (s === activeState && ALL_STATES.length > 1);
    petSetState(s);
    if (Math.random() < 0.28) playQuickAction(pick(['bounce','peek','wave','squish','shake']));
    if (Math.random() < 0.14) applyColor(pick(GROKBOT_COLORS));
    if (Math.random() < 0.10) startShapeShow();   // 变形秀彩蛋：圆→随机形状→圆（10% 概率，常驻球态）
  } catch (e) { /* 单次异常不卡死轮询 */ }
  stateTimer = setTimeout(changeState, rand(7000, 13000));
}
function scheduleBlinkPet() {
  clearTimeout(blinkTimer);
  blinkTimer = setTimeout(() => {
    if (!autoPaused && (theme === 'grok' || DATA.BLINK[activeState])) blink();
    scheduleBlinkPet();

}
// 偶尔自言自语（工作流语句），让小脸更"活"
function scheduleChatter() {

  if (theme === 'grok') return;                     // Grok 极简：不自言自语

}

/* ===== 视线跟随 + 点击反应 + 3D 拖动转向/移动 ===== */
let dragging = false, moveDist = 0, dragYaw = 0, dragPitch = 0;

viewer.addEventListener('pointermove', (e) => {
  const r = bot.getBoundingClientRect();
  const dx = clamp(((e.clientX - (r.left + r.width / 2)) / r.width) * 2, -.6, .6);
  const dy = clamp(((e.clientY - (r.top + r.height / 2)) / r.height) * 2, -.6, .6);
  gazeX = dx * 22; gazeY = dy * 14;
  bodyTilt.target = clamp(dx * 4, -4, 4);
});
viewer.addEventListener('pointerleave', () => { gazeX = 0; gazeY = 0; bodyTilt.target = 0; });

bot.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  dragging = true; moveDist = 0;
  dragYaw = yawSpring.x; dragPitch = pitchSpring.x;
  document.body.classList.add('dragging');
  if (window.electronAPI && window.electronAPI.dragStart) window.electronAPI.dragStart();
  try { bot.setPointerCapture(e.pointerId); } catch (_) {}
});
window.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  moveDist += Math.abs(e.movementX) + Math.abs(e.movementY);
  dragYaw = clamp(dragYaw + e.movementX * 0.55, -44, 44);
  dragPitch = clamp(dragPitch + e.movementY * 0.42, -26, 26);
  yawSpring.target = dragYaw;
  pitchSpring.target = dragPitch;
  if (window.electronAPI && window.electronAPI.dragMove) window.electronAPI.dragMove();
});
function endDrag() {
  if (!dragging) return;
  dragging = false;
  document.body.classList.remove('dragging');
  yawSpring.target = 0; pitchSpring.target = 0;
  if (window.electronAPI && window.electronAPI.dragEnd) window.electronAPI.dragEnd();
  if (moveDist < 6) {
    if (theme === 'grok') {
      // Grok 主题：单击 = 随机切换一个状态/表情（规格交互要求）
      const name = pick(GROK_ORDER);
      grokSetState(name);
      clearTimeout(grokTimer);
      const def = GROK_SHAPES_DEF[name];
      grokTimer = setTimeout(grokNext, rand(def.dur[0], def.dur[1]));
      showMood(pick(['嗯？', '嘿嘿', '在呢', '戳我干嘛']));
    } else {
      // 摸头撒娇：爱心上浮 + 傲娇台词 + 轻柔挤压
      reaction = { type: 'squash', t: 0, dur: 620 };
      eyePulse = 1; blink();
      for (let i = 0; i < 3; i++) setTimeout(() => spawnFxParticle('happy'), i * 180);
      showMood(pick(['嘿嘿~被摸头啦','舒服～(◡‿◡)','再来一下嘛','哎呀别戳啦']));
    }
  }
}
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);

/* 右键菜单（Electron）/ 浏览器提示 */
viewer.addEventListener('contextmenu', (e) => {
  if (window.electronAPI && window.electronAPI.showMenu) {
    e.preventDefault();
    window.electronAPI.showMenu();
  }
});

/* ===== 桌面穿透：仅在宠物本体上接收鼠标，透明区放行 ===== */
let lastIgnore = false;
if (window.electronAPI && window.electronAPI.setIgnore) {
  document.addEventListener('mousemove', (e) => {
    if (dragging) return; // 拖动期间不切换穿透，避免中断
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const onPet = !!(el && (el.closest('#bot') || el.closest('.mood-tag') || el.closest('.size-ctrl')));
    if (onPet === lastIgnore) return;
    lastIgnore = onPet;
    window.electronAPI.setIgnore(!onPet);
    if (!onPet) { gazeX = 0; gazeY = 0; bodyTilt.target = 0; }
  });
}

/* ===== 初始化 ===== */
applyColor(selectedColor);
applyScale(1);
chooseExpression(0);
activeState = 'idle';
showMood('Sonnet Bot 上线啦~');
rafId = requestAnimationFrame(frame);
// 尺寸按钮已移到右键菜单，悬停按钮取消
// 启动自动轮询 + 自言自语
cycleExpr();
changeState();
scheduleBlinkPet();
scheduleChatter();

/* ===== 给菜单/外部调用的接口 ===== */
function applyColorByHex(hex) {
  const item = GROKBOT_COLORS.find(c => c[2].toLowerCase() === hex.toLowerCase());
  if (item) applyColor(item);
  else if (theme !== 'grok') { document.documentElement.style.setProperty('--bot-color', hex); }
}
window.moodiePet = {
  nextMood: () => { const s = pick(ALL_STATES.filter(x => x !== activeState)) || pick(ALL_STATES); petSetState(s); },
  randomLook: () => { applyColor(pick(GROKBOT_COLORS)); chooseExpression(Math.floor(Math.random() * DATA.EXPRESSIONS.length)); playQuickAction(pick(['bounce','peek','wave','squish','shake'])); },
  togglePause,
  idlePause: pausePet,
  idleResume: resumePet,
  quit: () => { if (window.electronAPI && window.electronAPI.quit) window.electronAPI.quit(); },
};
// Electron 右键菜单回调
if (window.electronAPI && window.electronAPI.onMenuAction) {
  window.electronAPI.onMenuAction((action) => {
    if (action.indexOf('theme:') === 0) { applyTheme(action.slice(6)); showMood(action.slice(6) === 'grok' ? 'Sonnet 极简风 ✓' : '彩色风 ✓'); }
    else if (action.indexOf('color:') === 0) { applyColorByHex(action.slice(6)); showMood('换色~'); }
    else if (action.indexOf('shape:') === 0) { applyShape(action.slice(6)); showMood('变' + (selectedShape[1]) + '～'); }
    else if (action.indexOf('accessory:') === 0) { toggleAccessory(action.slice(10)); }
    else if (action.indexOf('size:') === 0) {
      const v = action.slice(5);
      if (v === 'minus') applyScale(petScale * 2/3);
      else if (v === 'plus') applyScale(petScale * 3/2);
      else applyScale(1);
    }
    else if (action === 'autostart:on') showMood('开机自启 ✓');
    else if (action === 'autostart:off') showMood('关闭自启');
    else if (window.moodiePet[action]) { window.moodiePet[action](); }
  });
}
</script>
